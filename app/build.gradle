plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += 'lib/arm64-v8a/libshadowhook.so'
        }
    }

    signingConfigs {
        release {
            storeFile file("canvas-distribution.jks")
            storePassword System.getenv("DIST_KS_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("DIST_KS_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "git.artdeell.skymodloader"
        minSdk 26
        targetSdk 34
        versionCode 75
        versionName "1.8.9"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                abiFilters "arm64-v8a"
                targets 'ciphered'
                arguments "-DANDROID_ARM_NEON=TRUE", '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures { // start gradle 8.0
        buildConfig true
        aidl = true
        dataBinding = true
        prefab true
    }
    ndkVersion = '29.0.14206865'
    namespace 'git.artdeell.skymodloader'
}

dependencies {

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'

    implementation( platform 'org.jetbrains.kotlin:kotlin-bom:1.8.0')

    implementation 'com.google.android.material:material:1.11.0'
    implementation 'net.fornwall:jelf:0.9.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
	implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "io.noties.markwon:core:4.6.2"
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout-core:1.0.4'
    implementation 'com.bytedance.android:shadowhook:1.0.9'

}
